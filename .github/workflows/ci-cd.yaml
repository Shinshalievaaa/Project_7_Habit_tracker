name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop", "feature/*" ]
  pull_request:
    branches: [ "main"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    # Запускаем контейнер с PostgreSQL рядом с тестами
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          poetry install

      - name: Run Flake8 Linting
        run: poetry run flake8 .

      - name: Run Tests
        env:
          SECRET_KEY: 'ci-secret-key-testing'
          DEBUG: 'True'
          POSTGRES_DB: 'test_db'
          POSTGRES_USER: 'postgres'
          POSTGRES_PASSWORD: 'postgres_password'
          POSTGRES_HOST: '127.0.0.1'
          POSTGRES_PORT: '5432'
          CELERY_BROKER_URL: 'redis://127.0.0.1:6379/0'
        run: |
          poetry run python manage.py test

  build-docker:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Image Check
        run: |
          docker build -t habit_tracker:latest .

  deploy:
    needs: build-docker
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/app
            
            # Если Git еще не инициализирован в этой папке
            if [ ! -d .git ]; then
              git init
              git remote add origin https://github.com/Shinshalievaaa/Project_7_Habit_tracker.git
            fi
            
            # Подтягиваем актуальный код с сохранением файла .env
            git fetch origin main
            git reset --hard origin/main
            
            # Запускаем сборку и миграции
            docker compose down
            docker compose up -d --build
            docker compose exec -T app poetry run python manage.py migrate
            docker compose exec -T app poetry run python manage.py collectstatic --noinput
            docker image prune -f