version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: habit_tracker_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: habit_tracker_redis
    restart: always
    ports:
      - "6379:6379"

  app:
    build: .
    container_name: habit_tracker_app
    restart: always
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media

  celery:
    build: .
    container_name: habit_tracker_celery
    restart: always
    command: celery -A config worker -l info
    env_file:
      - .env
    depends_on:
      - app
      - redis
      - db

  celery-beat:
    build: .
    container_name: habit_tracker_celery_beat
    restart: always
    command: celery -A config beat -l info
    env_file:
      - .env
    depends_on:
      - app
      - redis
      - db

  nginx:
    image: nginx:1.25-alpine
    container_name: habit_tracker_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - app

volumes:
  postgres_data:
  static_volume:
  media_volume: